name: eglise_connect
description: Gestion des contacts et du suivi des visiteurs de l'église.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État de l'application
  flutter_riverpod: ^2.6.1
  # Navigation
  go_router: ^14.6.0
  # HTTP vers l'API Laravel
  dio: ^5.7.0
  # Stockage local hors connexion
  sqflite: ^2.4.1
  path: ^1.9.0
  # Jeton d'accès chiffré (Keychain iOS / Keystore Android)
  flutter_secure_storage: ^9.2.2
  # Détection du retour de la connexion
  connectivity_plus: ^6.1.0
  # Identifiants générés sur le téléphone
  uuid: ^4.5.1
  # Appeler, SMS, WhatsApp
  url_launcher: ^6.3.1
  # Dates en français (version imposée par flutter_localizations)
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
